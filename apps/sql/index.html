<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JSONables SQL</title>
<link rel="stylesheet" href="/apps/shared/ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
	<h1>JSONables SQL</h1>
	<nav>
		<a href="/apps/gbiz/">gBizINFO 法人検索</a>
	</nav>
</header>

<main class="sqlapp">
	<aside class="schema">
		<div class="schema-title">JSONables</div>
		<div id="schema"></div>
	</aside>

	<section class="workspace">
		<div class="editorbar">
			<button id="run">実行</button>
			<button id="clear">クリア</button>
			<span id="status" class="status"></span>
			<span class="hint">44.7万社。集計・検索は軽量な gbiz.kihon（約1秒）、補助金・調達・特許まで含む全項目は gbiz.hojin（全走査に約20秒）。</span>
		</div>
		<textarea id="sql" spellcheck="false">SELECT $key, name, pref, industry_name, employee_number, patent_count
FROM gbiz.kihon
WHERE pref = '京都府' AND industry_name CONTAINS '製造業'
ORDER BY patent_count DESC
LIMIT 100;</textarea>
		<div id="result" class="result"></div>
	</section>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
